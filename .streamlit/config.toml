[server]
address = "127.0.0.1"
headless = true
maxUploadSize = 10

[browser]
gatherUsageStats = false

[client]
# Table toolbar exports bypass reviewed exporters and formula acknowledgment.
disableDataExport = true

[theme]
base = "light"
primaryColor = "#0F766E"
backgroundColor = "#F8FAFC"
secondaryBackgroundColor = "#EEF2F6"
textColor = "#172B4D"
font = "sans serif"
